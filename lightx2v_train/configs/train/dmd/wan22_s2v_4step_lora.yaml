model:
    name: wan_s2v
    pretrained_model_name_or_path: /data-training/models/Wan-AI/Wan2.2-S2V-14B
    # DiffSynth-Studio provides the trainable Wan2.2-S2V DiT backbone.
    # If pretrained_model_name_or_path points to a local Wan2.2-S2V directory
    # containing diffusion_pytorch_model*.safetensors, model_paths can stay null.
    transformer_class_path: lightx2v_train.model_zoo.wan_s2v:DiffSynthWanS2VBackbone
    transformer_factory: from_pretrained
    transformer_init_kwargs:
        # Optional override. Use a glob string, a list of local safetensors shards,
        # or null to auto-detect from pretrained_model_name_or_path.
        model_paths: /data-training/hjq/DiffSynth-Studio/models/train/rs800.safetensors
        # Optional remote-style DiffSynth config, for example:
        # - Wan-AI/Wan2.2-S2V-14B:diffusion_pytorch_model*.safetensors
        model_id_with_origin_paths: null
        download_source: null
        skip_download: null
        load_device: cpu
        # Must match the reference RoPE settings used for full SFT.
        s2v_ref_rope_mode: source_id_local
        s2v_ref_source_id: 1.0
        s2v_ref_rope_theta: 10000.0
        s2v_ref_time_base: 30
        s2v_ref_time_margin: 9
        use_gradient_checkpointing: true
        use_gradient_checkpointing_offload: false
        strict_batch_size_one: true
    max_sequence_length: 512
    running_dtype: bf16
    transformer_param_dtype: bf16
    vae_stride: [4, 8, 8]
    patch_size: [1, 2, 2]
    latent_channels: 16
    forward_style: lightx2v_s2v
    context_as_list: false
    fake:
        name: wan_s2v
        pretrained_model_name_or_path: /data-training/models/Wan-AI/Wan2.2-S2V-14B
    teacher:
        name: wan_s2v
        pretrained_model_name_or_path: /data-training/models/Wan-AI/Wan2.2-S2V-14B
        transformer_param_dtype: bf16

distributed:
    backend: nccl
    timeout_minutes: 60
    fsdp2:
        enabled: true
        reshard_after_forward:
            root_reshard: false
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: wan_s2v_cached_dataset
        cache_path:
            - /data-training/hjq/LightX2V/lightx2v_train/data_cache/wan22_s2v_480p/train
        dataset_repeat: 1
        batch_size: 1
        num_workers: 4
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: wan_s2v_cached_dataset
        cache_path:
            - /data-training/hjq/LightX2V/lightx2v_train/data_cache/wan22_s2v_480p/val
        max_samples: 1
        batch_size: 1
        num_workers: 0
        pin_memory: true
        shuffle: false

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_t: 0.001
    max_t: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: linear
        time_shift_mu: 5.0
        time_shift_power: 1.0
        sigma_min: 0.0
        extra_one_step: true

training:
    method: s2v_dmd_lora
    train_type: lora
    max_train_iters: 10000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 10
    dmd:
        num_inference_steps: 4
        fake_update_ratio: 5
        denoising_step_list:
            - 1000
            - 750
            - 500
            - 250
        warp_denoising_step: true
        ts_schedule: false
        ts_schedule_max: false
        num_train_timestep: 1000
        timestep_shift: 5.0
        min_score_timestep: 0
        min_step_ratio: 0.02
        max_step_ratio: 0.98
        renoise_sigma_min: 0.02
        renoise_sigma_max: 0.98
        renoise_discrete_samples: 1000
        renoise_shift: 5.0
    lora:
        rank: 64
        alpha: 64
        target_modules:
            - q
            - k
            - v
            - o
            - ffn.0
            - ffn.2
    student:
        optimizer:
            learning_rate: 0.000002
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    fake:
        optimizer:
            learning_rate: 0.0000004
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    teacher:
        guidance_scale: 4.5
        negative_prompt: " "
        cfg_norm: none
    output_dir: ./output_train/wan22_s2v_4step_lora_source_id_local

inference:
    method: disabled
    default_width: 832
    default_height: 480
    infer_frames: 80
    motion_frames: 73
    num_inference_steps: 4
    infer_every_iters: null
    output_dir: ./output_infer/wan22_s2v_4step_lora_source_id_local

logging:
    rank_zero_only: true
    train_log_every_iters: 10
    infer_log_every_steps: 10

resume:
    auto_resume: true
